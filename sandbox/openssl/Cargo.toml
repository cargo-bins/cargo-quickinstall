# Builds nothing of its own: sandbox/Dockerfile builds this so that build.rs
# runs, which builds a static OpenSSL for every Linux target.
[package]
name = "sandbox-openssl"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[build-dependencies]
openssl-src = "400"

# Not part of the repository's workspace.
[workspace]
