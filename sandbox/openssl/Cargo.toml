# Builds nothing of its own: sandbox/Dockerfile builds this so that build.rs
# runs, which builds a static OpenSSL 3 and 4 for every Linux target.
[package]
name = "sandbox-openssl"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[build-dependencies]
# .github/dependabot.yml keeps each of them on its major version.
openssl-src-3 = { package = "openssl-src", version = "300" }
openssl-src-4 = { package = "openssl-src", version = "400" }

# Not part of the repository's workspace.
[workspace]
