# Dependabot dependency version checks / updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    # Workflow files stored in the
    # default location of `.github/workflows`
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: "cargo"
    # This will update the Cargo.lock
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      deps:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    # This will update the cargo-quickinstall/Cargo.toml
    directory: "/cargo-quickinstall"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      deps:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    # This will update the stats-server/Cargo.toml
    directory: "/stats-server"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      deps:
        patterns:
          - "*"    
  - package-ecosystem: "pip"
    # This will update requirements.txt
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      deps:
        patterns:
          - "*"
