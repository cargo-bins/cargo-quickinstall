# Dependabot dependency version checks / updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    # Workflow files stored in the
    # default location of `.github/workflows`
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: "cargo"
    # This will update the Cargo.lock
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      deps:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    # This will update the cargo-quickinstall/Cargo.toml
    directory: "/cargo-quickinstall"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      deps:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    # This will update the stats-server/Cargo.toml
    directory: "/stats-server"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      deps:
        patterns:
          - "*"    
  - package-ecosystem: "cargo"
    # This will update the OpenSSL that sandbox/Dockerfile builds
    directory: "/sandbox/openssl"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      deps:
        patterns:
          - "*"
    ignore:
      # It builds OpenSSL 3 and 4 from two openssl-src dependencies, so keep
      # each on its major version.
      - dependency-name: "openssl-src"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    # This will update requirements.txt
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      deps:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    # This will update the base image of sandbox/Dockerfile
    directory: "/sandbox"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      # Only Ubuntu LTS releases (even years, .04). Everything between two of
      # them is an interim release with nine months of support. Extend the
      # list before 2040.
      - dependency-name: "ubuntu"
        versions:
          - "> 26.04, < 28.04"
          - "> 28.04, < 30.04"
          - "> 30.04, < 32.04"
          - "> 32.04, < 34.04"
          - "> 34.04, < 36.04"
          - "> 36.04, < 38.04"
          - "> 38.04, < 40.04"
