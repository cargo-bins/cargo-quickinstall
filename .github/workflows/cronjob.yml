name: Cronjob

concurrency:
  group: trigger-package-build

on:
  # Run every hour on the hour.
  schedule:
    - cron: "0 * * * *"
  # If you are an upstream maintainer and you want to test your branch before merging, run
  #
  #     git push
  #     gh workflow run cronjob.yml --ref $(git rev-parse --abbrev-ref HEAD)
  #     gh run list --workflow=cronjob.yml -L1 --json url
  #
  # This may also work on forks, but you might need to set up some repo secrets first,
  # and I've not tested it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Restoring a cache can overwrite any file on the runner, and every job on
  # main can write cache entries, including the jobs in build-package.yml that
  # run build scripts of arbitrary crates. So only this job, which holds no
  # write tokens, restores the cache, and it hands the list on as an artifact.
  popular-crates:
    name: Get popular crates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/cronjob-setup

      - name: Get popular crates
        run: |
          make cronjob_scripts/.python-deps-updated.timestamp
          .venv/bin/crates-io-popular-crates

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: popular-crates
          path: cached_crates_io_popular_crates.parquet
          if-no-files-found: error
          retention-days: 1

  build-popular-package:
    name: Build
    needs: popular-crates
    # This is because I want to use a vaguely modern python without having to install it.
    # Other actions will may use an older version of ubuntu in order to link an older glibc,
    # but this action won't be doing any building so it's fine.
    runs-on: ubuntu-latest
    permissions:
      contents: write # push trigger branches
      actions: write # trigger build-package.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      # No caches in this job, see popular-crates above.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: "cronjob_scripts/.python-version"

      # Download outside of the checkout and copy only the file we want, so
      # that the artifact cannot replace anything else.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: popular-crates
          path: ${{ runner.temp }}/popular-crates

      - name: Use popular crates
        run: cp "$RUNNER_TEMP/popular-crates/cached_crates_io_popular_crates.parquet" .

      - name: Trigger Package Build
        id: find_crate
        run: make trigger-all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INFLUXDB_TOKEN: ${{ secrets.INFLUXDB_TOKEN }}
          CRATE_CHECK_LIMIT: 10
          PYTHONUNBUFFERED: 1
