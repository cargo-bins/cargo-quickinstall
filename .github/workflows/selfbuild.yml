name: Self-Build

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  self-build:
    name: Self-Build
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - target_arch: x86_64-pc-windows-msvc
            os: windows-latest
          - target_arch: x86_64-apple-darwin
            os: macos-latest
          - target_arch: aarch64-apple-darwin
            os: macos-latest
          - target_arch: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target_arch: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target_arch: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install latest rust
        run: rustup toolchain install stable --no-self-update --profile minimal
      - uses: ./.github/actions/cache-cargo-install
      - name: Install Thyself
        run: cargo install --path cargo-quickinstall
      - name: Install Thyself with Thyself (or fallback to sensei on windows)
        run: cargo quickinstall cargo-quickinstall || cargo quickinstall sensei
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-needing-cc:
    name: Build package that needs CC
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - target_arch: x86_64-pc-windows-msvc
            os: windows-latest
          - target_arch: aarch64-pc-windows-msvc
            os: windows-latest
          # blake3 has no C code for 32-bit ARM unless its neon feature is
          # on, and its NEON flags don't survive cargo-zigbuild's cc
          # wrapper. ripgrep's pcre2 feature builds plain C instead.
          - target_arch: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            crate: ripgrep
            features: pcre2
          - target_arch: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            crate: ripgrep
            features: pcre2
          - target_arch: x86_64-apple-darwin
            os: macos-latest
          - target_arch: aarch64-apple-darwin
            os: macos-latest
          - target_arch: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target_arch: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target_arch: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target_arch: aarch64-unknown-linux-musl
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install latest rust
        run: rustup toolchain install stable --no-self-update --profile minimal

      # No cache-cargo-install here: every sandbox in build-version.sh drops
      # CARGO_TARGET_DIR (or never sees the directory), so a cached target
      # dir would only be downloaded and never used.

      # b3sum is small, but blake3's build script compiles assembly with cc
      # on x86_64 and NEON C intrinsics on aarch64.
      - name: Build ${{ matrix.crate || 'b3sum' }}
        env:
          CRATE: ${{ matrix.crate || 'b3sum' }}
          TARGET_ARCH: ${{ matrix.target_arch }}
          FEATURES: ${{ matrix.features }}
          SANDBOX: 1 # see build-version.sh
        run: |
          set -euxo pipefail
          touch .env
          VERSION="$(
            curl \
              --user-agent "cargo-quickinstall build pipeline (alsuren@gmail.com)" \
              --fail "https://crates.io/api/v1/crates/$CRATE" \
              | jq -r '.crate|.max_stable_version'
          )"
          ALWAYS_BUILD=1 VERSION="$VERSION" TARGET_ARCH="$TARGET_ARCH" ./build-version.sh "$CRATE"

  build-package-test:
    name: Build package test
    uses: ./.github/workflows/build-package.yml
    permissions:
      contents: write
      actions: write
    secrets:
      MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
    with:
      crate: cargo-quickinstall
      version: 0.2.9
      target_arch: x86_64-unknown-linux-gnu
      build_os: ubuntu-latest
      branch: ${{ github.head_ref }}
      always_build: 1
      skip_upload: true
      # The signing environment only allows main.
      skip_signing: ${{ github.event_name != 'push' }}

  # Dummy job to have a stable name for the "all tests pass" requirement
  selfbuild-tests-pass:
    name: selfbuild tests pass
    needs:
      - self-build
      - build-needing-cc
      - build-package-test
    if: always() # always run even if dependencies fail
    runs-on: ubuntu-latest
    steps:
      # fail if ANY dependency has failed or cancelled
      - if: "contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')"
        run: exit 1
      - run: exit 0
