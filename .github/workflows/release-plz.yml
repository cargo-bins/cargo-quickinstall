name: Release-plz

permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # open release PRs
      contents: write # push release tags and trigger branches
      id-token: write # crates.io trusted publishing
      actions: write # trigger build-package.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        run: rustup toolchain install stable --no-self-update --profile minimal
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Run release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - uses: ./.github/actions/cronjob-setup
      - name: Trigger tarball builds of cargo-quickinstall
        run: make recheck-self-only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
