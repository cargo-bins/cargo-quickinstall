# Coding format checker and test runner.
name: Automated tests

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Fetch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run shellcheck
        run: shellcheck *.sh

      # The `builds` branch holds a copy of .github/builds-branch/build-package.yml,
      # updated by hand (see that file). Fail on main when it has drifted, so
      # that it gets updated; on PRs only warn, because `builds` can only be
      # updated once main has what the new wrapper calls.
      - name: Check the builds branch wrapper
        env:
          STRICT: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin builds
          if git show FETCH_HEAD:.github/workflows/build-package.yml |
              diff -u - .github/builds-branch/build-package.yml; then
            echo "builds is up to date"
          elif [ "$STRICT" = true ]; then
            echo "::error::Update the builds branch, see .github/builds-branch/build-package.yml"
            exit 1
          else
            echo "::warning::Update the builds branch once this is on main, see .github/builds-branch/build-package.yml"
          fi

      # A pinned release checked against its checksum, not a cached binary:
      # macOS and Windows build jobs run crate code with a token that can
      # write caches this job would restore, and shfmt is executed here.
      - name: Install shfmt
        env:
          SHFMT_VERSION: v3.14.1
          SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/bin/shfmt" \
            "https://github.com/mvdan/sh/releases/download/$SHFMT_VERSION/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "$SHFMT_SHA256  $RUNNER_TEMP/bin/shfmt" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/shfmt"

      - name: Run shfmt
        run: '"$RUNNER_TEMP/bin/shfmt" --diff *.sh'

      - name: Install latest rust
        run: rustup toolchain install stable --no-self-update --profile minimal --component clippy,rustfmt

      - name: Lint
        run: cargo fmt --check

  test:
    name: Test runner
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      # TODO: actions/cache@v2?
      - name: Fetch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch tags required for testing
        run: git fetch --tags

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-all-crates: true
          workspaces: |
            . -> target
            stats-server -> target

      - name: Run cargo clippy for client project
        run: cargo clippy --all-targets --all-features --no-deps -- -D warnings

      - name: Run cargo clippy for stats-server project
        run: cargo clippy --all-targets --all-features --no-deps -- -D warnings
        working-directory: stats-server

      - name: Run cargo test
        run: cargo test

      - uses: ./.github/actions/cronjob-setup

      - name: Check python cronjob_scripts
        run: make check-cronjob-scripts

      - name: Test python cronjob_scripts
        run: make test-cronjob-scripts
        if: github.event_name != 'pull_request'
        env:
          INFLUXDB_TOKEN: ${{ secrets.INFLUXDB_TOKEN }}

  e2etest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Fetch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install latest rust
        run: rustup toolchain install stable --no-self-update --profile minimal
          
      - name: Test dry-run
        run: cargo run -- --dry-run cargo-quickinstall

      - name: Test installing and using binstall
        run: |
          set -euxo pipefail
          cargo run -- cargo-quickinstall
          cargo quickinstall -V
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test using binstall with it already installed
        run: |
          set -euxo pipefail
          cargo run -- cargo-quickinstall
          cargo quickinstall -V

      - name: Test batch installation with binstall
        run: |
          set -euxo pipefail
          cargo run -- cargo-quickinstall cargo-update@18.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Try running the binary
        run: |
          cargo quickinstall -V
          cargo install-update -V

      - name: Test batch installation with binstall with force
        run: |
          set -euxo pipefail
          echo Rm all binaries installed but do not update manifests,
          echo so that binstall will think they are installed.
          rm $(which cargo-quickinstall) $(which cargo-update@18.0.0)
          cargo run -- --force cargo-quickinstall cargo-update@18.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Try running the binary
        run: |
          cargo quickinstall -V
          cargo install-update -V
      - name: Test batch installation with curl
        run: |
          set -euxo pipefail
          cargo run -- --no-binstall cargo-quickinstall cargo-update@18.0.0
          cargo quickinstall -V
          cargo install-update -V

  # Dummy job to have a stable name for the "all tests pass" requirement
  automated-tests-pass:
    name: automated tests pass
    needs:
      - test
      - e2etest
      - lint
    if: always() # always run even if dependencies fail
    runs-on: ubuntu-latest
    steps:
      # fail if ANY dependency has failed or cancelled
      - if: "contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')"
        run: exit 1
      - run: exit 0
