name: Build package

on:
  workflow_call:
    inputs:
      crate:
        description: Crate to release
        required: true
        type: string
      version:
        description: Version to release
        required: true
        type: string
      target_arch:
        description: Target to build against
        required: true
        type: string
      build_os:
        description: The OS to use for building
        required: true
        type: string
      branch:
        description: The branch which is checked out
        required: true
        type: string
      features:
        description: Features to enable
        default: ""
        type: string
      no_default_features:
        description: Disable default features
        default: ""
        type: string
      always_build:
        description: Always build even if it's already present, set to 1 to enable this
        default: ""
        type: string
      skip_upload:
        description: Skip upload
        default: false
        type: boolean
      skip_signing:
        description: Skip signing
        default: false
        type: boolean
    secrets:
      MINISIGN_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      crate:
        description: Crate to release
        required: true
        type: string
      version:
        description: Version to release
        required: true
        type: string
      target_arch:
        description: Target to build against
        required: true
        type: string
      build_os:
        description: The OS to use for building
        required: true
        type: string
      branch:
        description: The branch which is checked out
        required: true
        type: string
      features:
        description: Features to enable
        default: ""
        type: string
      no_default_features:
        description: Disable default features
        default: ""
        type: string
      always_build:
        description: Always build even if it's already present, set to 1 to enable this
        default: ""
        type: string
      skip_upload:
        description: Skip upload
        default: false
        type: boolean
      skip_signing:
        description: Skip signing
        default: false
        type: boolean

# The cronjob dispatches this workflow on the `builds` branch, not on main.
# That branch holds only a wrapper, .github/builds-branch/build-package.yml,
# which calls this file on main. The build job runs crate code with a runtime
# token that can write Actions caches in the scope of the ref the run is on, so
# this way it can only write `builds` caches, which nothing on main restores.
# Every checkout below names `inputs.branch` for that reason: the ref of the
# run is the `builds` branch, which has no scripts.

# Serialise builds that upload the same tarball. Use `inputs`, not
# `github.event.inputs`: under workflow_call the event is the caller's, which
# has no inputs, so every selfbuild run shared one group and a queued run was
# cancelled whenever another PR queued behind it. Runs that skip the upload
# write nothing shared, so give each its own group.
concurrency:
  group: build-package-${{ inputs.crate }}-${{ inputs.version }}-${{ inputs.target_arch }}${{ inputs.skip_upload && format('-run-{0}', github.run_id) || '' }}

env:
  CRATE: ${{ inputs.crate }}
  TARGET_ARCH: ${{ inputs.target_arch }}
  VERSION: ${{ inputs.version }}
  FEATURES: ${{ inputs.features }}
  NO_DEFAULT_FEATURES: ${{ inputs.NO_DEFAULT_FEATURES }}
  BUILD_DIR: ${{ github.workspace }}/built.d

run-name: Build Package ${{ inputs.crate }} ${{ inputs.version }} (${{ inputs.build_os }})

permissions:
  contents: read

jobs:
  build-popular-package:
    name: build-popular-package-${{ inputs.crate }}-${{ inputs.version }}-${{ inputs.target_arch }}-${{ inputs.features }}
    runs-on: ${{ inputs.build_os }}
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout main repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.branch }}
          path: cargo-quickinstall

      - name: Print inputs
        run: |
          echo $CRATE
          echo $VERSION
          echo $TARGET_ARCH
          echo $FEATURES

      - name: Install latest rust
        run: rustup toolchain install stable --no-self-update --profile minimal

      - name: build package
        env:
          ALWAYS_BUILD: ${{ inputs.always_build }}
          TEMPDIR: ${{ env.BUILD_DIR }}
          # Linux targets build in a container, macOS targets as a separate
          # user under sandbox-exec, see build-version.sh.
          SANDBOX: 1
        run: |
          set -euxo pipefail
          # `tar` does not understand mixed forward and backslashes, but mkdir does.
          # Try coercing it into a single style?
          mkdir -p "$TEMPDIR"
          pushd "$TEMPDIR"
          TEMPDIR="$PWD"
          popd

          cargo-quickinstall/build-version.sh "$CRATE"
          touch "$TEMPDIR/dummy-file"
          ls "$TEMPDIR"
      # For Linux targets the crate was built in a container, and for macOS
      # targets as a user without sudo, see build-version.sh. For Windows it
      # ran on the runner itself, and with admin rights it could have reached
      # the runtime token, so do not trust anything on this machine any more.

      - name: Upload run-local binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-${{ inputs.build_os }}
          path: ${{ env.BUILD_DIR }}
          if-no-files-found: error

  # The signing key is only exposed to this job. The only code from the
  # repository it runs is the tarball check, from main or the commit of the
  # run, so nothing that runs here can be swapped by pushing a branch. Keep
  # it that way.
  #
  # MINISIGN_PRIVATE_KEY should live in the `signing` environment, restricted
  # to the `main` and `builds` branches. A job that names an environment reads that
  # environment's secret in preference to the one passed by the caller.
  sign-popular-package:
    name: Sign
    needs: build-popular-package
    if: ${{ !inputs.skip_signing }}
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      contents: read # fetch the tarball check
    defaults:
      run:
        shell: bash
    env:
      BUILD_ARCHIVE: ${{ github.workspace }}/built.d/${{ inputs.crate }}-${{ inputs.version }}-${{ inputs.target_arch }}.tar.gz
      SIG_FILENAME: ${{ github.workspace }}/built.d/${{ inputs.crate }}-${{ inputs.version }}-${{ inputs.target_arch }}.tar.gz.sig
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-${{ inputs.build_os }}
          path: ${{ env.BUILD_DIR }}

      # The upload job cancels the run when there is no tarball.
      - name: Check for tarball
        id: tarball
        run: |
          if [ -f "$BUILD_ARCHIVE" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      # Clients untar this straight into ~/.cargo/bin, and the build that made
      # it ran crate code, so only sign plain files with plain names.
      #
      # The check comes from the commit this workflow runs from, never from
      # inputs.branch: this job holds the signing key, so the branch being
      # built must not be able to change what runs here. On `builds`, which
      # holds only a wrapper that calls this workflow on main, that is main.
      # The signing environment only admits main and `builds`, so this job
      # does not reach the key from any other ref.
      - name: Fetch the tarball check
        if: steps.tarball.outputs.found == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref == 'refs/heads/builds' && 'main' || github.sha }}
          path: checks
          sparse-checkout: .github/scripts/check-tarball.py
          sparse-checkout-cone-mode: false

      - name: Check the tarball's entries
        if: steps.tarball.outputs.found == 'true'
        run: python3 -I checks/.github/scripts/check-tarball.py "$BUILD_ARCHIVE"

      - name: Install minisign
        if: steps.tarball.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Sign the tarball
        if: steps.tarball.outputs.found == 'true'
        run: |
          set -euo pipefail
          key="$(mktemp -p "$RUNNER_TEMP")"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_PRIVATE_KEY" > "$key"
          minisign -S -s "$key" -x "$SIG_FILENAME" -m "$BUILD_ARCHIVE"
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}

      - name: Upload signature
        if: steps.tarball.outputs.found == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: ${{ env.SIG_FILENAME }}
          if-no-files-found: error

  upload-popular-package:
    name: Upload
    needs:
      - build-popular-package
      - sign-popular-package
    # Also run when signing is skipped.
    if: >-
      ${{
        !cancelled()
        && needs.build-popular-package.result == 'success'
        && (needs.sign-popular-package.result == 'success'
            || (inputs.skip_signing && needs.sign-popular-package.result == 'skipped'))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag and upload release assets
      actions: write # cancel the run when there is nothing to upload
    defaults:
      run:
        shell: bash
    env:
      BUILD_ARCHIVE: ${{ github.workspace }}/built.d/${{ inputs.crate }}-${{ inputs.version }}-${{ inputs.target_arch }}.tar.gz
      SIG_FILENAME: ${{ github.workspace }}/built.d/${{ inputs.crate }}-${{ inputs.version }}-${{ inputs.target_arch }}.tar.gz.sig
    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: ${{ inputs.branch }}
          path: trigger

      - name: Download binary artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-${{ inputs.build_os }}
          path: ${{ env.BUILD_DIR }}

      # build-version.sh skips the build, leaving only dummy-file in the
      # artifact, when the release already has this crate's tarball for this
      # target (unless always_build is set). Nothing to upload then.
      - name: Cancel if no tarball
        run: |
          if [ ! -f "$BUILD_ARCHIVE" ]; then
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
            # Wait for the cancellation signal.
            sleep 1m
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download signature
        if: ${{ !inputs.skip_signing }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signature
          path: ${{ env.BUILD_DIR }}

      - name: Tag release
        if: ${{ !inputs.skip_upload }}
        run: |
          (
            set -euxo pipefail
            cd trigger
            if ! ./create_and_upload_tag.sh "$CRATE-$VERSION"; then
                echo "$CRATE-$VERSION tag already exists"
            fi
          )

      - name: Releasing assets in new release format
        if: ${{ !inputs.skip_upload }}
        run: |
          set -euo pipefail
          tag="$CRATE-$VERSION"
          # Builds for other targets share this release, so it may already
          # exist, or be created by one of them concurrently.
          if ! gh release view "$tag" --json tagName >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --latest \
              --title "$tag" --notes "build $CRATE@$VERSION" ||
              gh release view "$tag" --json tagName >/dev/null
          fi
          # Fails if an asset with the same name was already uploaded.
          gh release upload "$tag" "$BUILD_ARCHIVE"
          gh release upload "$tag" "$SIG_FILENAME"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  build-popular-package-failure:
    needs:
      - build-popular-package
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the exclude list to the trigger branch
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout trigger branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: trigger/${{ inputs.target_arch }}
          path: trigger
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.branch }}
          path: cargo-quickinstall
      - name: Record failure
        run: '"$GITHUB_WORKSPACE/cargo-quickinstall/add-exclude.sh" "$GITHUB_WORKSPACE/trigger"'
