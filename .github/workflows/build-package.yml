name: Build package

on:
  workflow_call:
    inputs:
      crate:
        description: Crate to release
        required: true
        type: string
      version:
        description: Version to release
        required: true
        type: string
      target_arch:
        description: Target to build against
        required: true
        type: string
      build_os:
        description: The OS to use for building
        required: true
        type: string
      branch:
        description: The branch which is checked out
        required: true
        type: string
      features:
        description: Features to enable
        default: ""
        type: string
      no_default_features:
        description: Disable default features
        default: ""
        type: string
      always_build:
        description: Always build even if it's already present, set to 1 to enable this
        default: ""
        type: string
      skip_upload:
        description: Skip upload
        default: false
        type: boolean
      skip_signing:
        description: Skip signing
        default: false
        type: boolean
    secrets:
      MINISIGN_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      crate:
        description: Crate to release
        required: true
        type: string
      version:
        description: Version to release
        required: true
        type: string
      target_arch:
        description: Target to build against
        required: true
        type: string
      build_os:
        description: The OS to use for building
        required: true
        type: string
      branch:
        description: The branch which is checked out
        required: true
        type: string
      features:
        description: Features to enable
        default: ""
        type: string
      no_default_features:
        description: Disable default features
        default: ""
        type: string
      always_build:
        description: Always build even if it's already present, set to 1 to enable this
        default: ""
        type: string
      skip_upload:
        description: Skip upload
        default: false
        type: boolean
      skip_signing:
        description: Skip signing
        default: false
        type: boolean

concurrency:
  group: build-package-${{ github.event.inputs.crate }}-${{ github.event.inputs.version }}-${{ github.event.inputs.target_arch }}

env:
  CRATE: ${{ inputs.crate }}
  TARGET_ARCH: ${{ inputs.target_arch }}
  VERSION: ${{ inputs.version }}
  FEATURES: ${{ inputs.features }}
  NO_DEFAULT_FEATURES: ${{ inputs.NO_DEFAULT_FEATURES }}
  BUILD_DIR: ${{ github.workspace }}/built.d

run-name: Build Package ${{ inputs.crate }} ${{ inputs.version }} (${{ inputs.build_os }})

permissions:
  contents: read

jobs:
  build-popular-package:
    name: build-popular-package-${{ inputs.crate }}-${{ inputs.version }}-${{ inputs.target_arch }}-${{ inputs.features }}
    runs-on: ${{ inputs.build_os }}
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: trigger
      - name: Checkout main repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.branch }}
          path: cargo-quickinstall

      - name: Print inputs
        run: |
          echo $CRATE
          echo $VERSION
          echo $TARGET_ARCH
          echo $FEATURES

      - name: Install latest rust
        run: rustup toolchain install stable --no-self-update --profile minimal

      - name: build package
        env:
          ALWAYS_BUILD: ${{ inputs.always_build }}
          TEMPDIR: ${{ env.BUILD_DIR }}
        run: |
          set -euxo pipefail
          # `tar` does not understand mixed forward and backslashes, but mkdir does.
          # Try coercing it into a single style?
          mkdir -p "$TEMPDIR"
          pushd "$TEMPDIR"
          TEMPDIR="$PWD"
          popd

          cargo-quickinstall/build-version.sh "$CRATE"
          touch "$TEMPDIR/dummy-file"
          ls "$TEMPDIR"
      # At this point, I don't think that you can really trust anything on the system anymore.
      # I'm not sure whether the js actions runtime is also affected by this.
      # TODO: try breaking things so that uploads don't work.

      - name: Upload run-local binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-${{ inputs.build_os }}
          path: ${{ env.BUILD_DIR }}
          if-no-files-found: error

  upload-popular-package:
    name: Upload
    needs: build-popular-package
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag and upload release assets
      actions: write # cancel the run when there is nothing to upload
    defaults:
      run:
        shell: bash
    env:
      BUILD_ARCHIVE: ${{ github.workspace }}/built.d/${{ inputs.crate }}-${{ inputs.version }}-${{ inputs.target_arch }}.tar.gz
      SIG_FILENAME: ${{ github.workspace }}/built.d/${{ inputs.crate }}-${{ inputs.version }}-${{ inputs.target_arch }}.tar.gz.sig
    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          path: trigger
      - name: Checkout main repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # TODO: maybe this should be main or configurable or something?
          ref: ${{ inputs.branch }}
          path: cargo-quickinstall

      - name: Download binary artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-${{ inputs.build_os }}
          # TODO: check that we it can't write anywhere other than built.d
          path: ${{ env.BUILD_DIR }}

      - name: Cancel if no tarball
        run: |
          if [ ! -f "$BUILD_ARCHIVE" ]; then
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
            # Wait for the cancellation signal.
            sleep 1m
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install minisign
        run: |
          set -euxo pipefail
          cd /tmp
          curl -L "$URL" | tar -xz
          sudo mv minisign-linux/x86_64/minisign /usr/local/bin
        env:
          URL: https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz

      - name: Sign the tarball
        if: "! inputs.skip_signing"
        run: |
          echo "$MINISIGN_PRIVATE_KEY" > /tmp/minisign-key
          minisign -S -s /tmp/minisign-key -x $SIG_FILENAME -m $BUILD_ARCHIVE
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}

      - name: Tag release
        if: "! inputs.skip_upload"
        run: |
          (
            set -euxo pipefail
            cd trigger
            if ! ../cargo-quickinstall/create_and_upload_tag.sh $CRATE-$VERSION; then
                echo "$CRATE-$VERSION tag already exists"
            fi
          )

      - name: Releasing assets in new release format
        if: "! inputs.skip_upload"
        run: |
          set -euo pipefail
          tag="$CRATE-$VERSION"
          # Builds for other targets share this release, so it may already
          # exist, or be created by one of them concurrently.
          if ! gh release view "$tag" --json tagName >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --latest \
              --title "$tag" --notes "build $CRATE@$VERSION" ||
              gh release view "$tag" --json tagName >/dev/null
          fi
          # Fails if an asset with the same name was already uploaded.
          gh release upload "$tag" "$BUILD_ARCHIVE"
          gh release upload "$tag" "$SIG_FILENAME"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Upload signature
        if: "! inputs.skip_signing"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: ${{ env.SIG_FILENAME }}
          if-no-files-found: error

  build-popular-package-failure:
    needs:
      - build-popular-package
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the exclude list to the trigger branch
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout trigger branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: trigger/${{ inputs.target_arch }}
          path: trigger
      - name: Checkout trigger commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: cargo-quickinstall
      - name: Record failure
        run: '"$GITHUB_WORKSPACE/cargo-quickinstall/add-exclude.sh" "$GITHUB_WORKSPACE/trigger"'
